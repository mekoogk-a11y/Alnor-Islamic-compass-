    <script>
      // Suppress Vite HMR WebSocket disconnect noise in cloud container iframe preview
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && (typeof event.reason === 'string' && event.reason.includes('WebSocket') || event.reason.message?.includes('WebSocket'))) {
          event.preventDefault();
        }
      });
    </script>
