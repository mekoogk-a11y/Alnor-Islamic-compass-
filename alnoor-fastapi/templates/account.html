{% extends "base.html" %}
{% block content %}
<section class="section">
  <div class="container" style="max-width:680px;">
    <div class="card" style="padding:2rem;">
      <div class="card-meta">حساب العضو المسجل</div>
      <h1 class="section-title" style="margin:0.35rem 0 1rem;">مرحباً، {{ current_user.full_name }}</h1>
      <p style="margin:0 0 0.5rem;">البريد الإلكتروني: {{ current_user.email }}</p>
      <p style="margin:0 0 1.5rem;">الصلاحية: {{ current_user.role }}</p>
      <div style="display:flex;flex-wrap:wrap;gap:0.75rem;">
        <a href="/courses" class="btn btn-primary btn-sm">تصفح الدورات</a>
        <a href="/charity" class="btn btn-emerald btn-sm">المشاريع الخيرية</a>
        <form action="/logout" method="post">
          <button type="submit" class="btn btn-outline btn-sm">تسجيل الخروج</button>
        </form>
      </div>
    </div>
  </div>
</section>
{% endblock %}
