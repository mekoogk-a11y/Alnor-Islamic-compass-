<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#021c15"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  
  <!-- Outer Decorative Ring -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-dasharray="8 6" opacity="0.6"/>
  <circle cx="256" cy="256" r="222" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.8"/>

  <!-- Islamic 8-Pointed Star (Rub el Hizb) Background Geometry -->
  <g fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.4">
    <rect x="136" y="136" width="240" height="240" rx="12"/>
    <rect x="136" y="136" width="240" height="240" rx="12" transform="rotate(45 256 256)"/>
  </g>

  <!-- Subtle Center Aura -->
  <circle cx="256" cy="256" r="140" fill="url(#innerGlow)"/>

  <!-- Islamic Crescent & Star Motif -->
  <path d="M 285 105 A 155 155 0 1 1 160 355 A 135 135 0 1 0 285 105 Z" fill="url(#goldGrad)" opacity="0.25"/>

  <!-- The Open Holy Quran Symbol -->
  <g transform="translate(116, 170)">
    <!-- Quran Stand Base (Rihal) -->
    <path d="M 40 220 L 140 160 L 240 220 L 220 235 L 140 185 L 60 235 Z" fill="url(#goldGrad)" opacity="0.85"/>
    <path d="M 60 160 L 140 220 L 220 160 L 240 175 L 140 245 L 40 175 Z" fill="url(#goldGrad)" opacity="0.85"/>

    <!-- Left Book Page -->
    <path d="M 140 40 C 95 32 30 50 15 65 C 10 95 10 165 15 175 C 30 160 95 142 140 150 Z" fill="#ffffff" fill-opacity="0.95"/>
    <path d="M 140 45 C 100 38 40 55 25 70 C 22 95 22 155 25 165 C 40 150 100 135 140 142 Z" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>

    <!-- Left Page Lines -->
    <line x1="45" y1="85" x2="120" y2="72" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="45" y1="105" x2="120" y2="92" stroke="#059669" stroke-width="2" stroke-linecap="round"/>
    <line x1="45" y1="125" x2="120" y2="112" stroke="#059669" stroke-width="2" stroke-linecap="round"/>
    <line x1="45" y1="145" x2="120" y2="132" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>

    <!-- Right Book Page -->
    <path d="M 140 40 C 185 32 250 50 265 65 C 270 95 270 165 265 175 C 250 160 185 142 140 150 Z" fill="#ffffff" fill-opacity="0.95"/>
    <path d="M 140 45 C 180 38 240 55 255 70 C 258 95 258 155 255 165 C 240 150 180 135 140 142 Z" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>

    <!-- Right Page Lines -->
    <line x1="160" y1="72" x2="235" y2="85" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="160" y1="92" x2="235" y2="105" stroke="#059669" stroke-width="2" stroke-linecap="round"/>
    <line x1="160" y1="112" x2="235" y2="125" stroke="#059669" stroke-width="2" stroke-linecap="round"/>
    <line x1="160" y1="132" x2="235" y2="145" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>

    <!-- Book Spine Glow -->
    <path d="M 136 40 L 144 40 L 144 150 L 136 150 Z" fill="url(#goldGrad)"/>
  </g>

  <!-- Golden Radiance Star at Top -->
  <polygon points="256,120 262,138 280,138 265,149 271,167 256,156 241,167 247,149 232,138 250,138" fill="url(#goldGrad)"/>
</svg>
